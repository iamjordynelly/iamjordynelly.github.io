# Met le site en ligne, et vérifie toutes les 15 minutes s'il y a une nouvelle vidéo YouTube.
# Si oui : la carte "Notre dernière vidéo" est mise à jour et le site republié, même Mac éteint.
name: Site Jordy & Nelly

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dernière vidéo YouTube
        id: video
        run: |
          out=$(node tools/update-latest-video.mjs)
          echo "$out"
          if [[ "$out" == UPDATED* ]]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Enregistrer la nouvelle vidéo
        if: steps.video.outputs.changed == 'true'
        run: |
          git config user.name "Jordy & Nelly"
          git config user.email "357504358+iamjordynelly@users.noreply.github.com"
          git add data.js index.html
          git commit -m "Nouvelle vidéo en haut du site (automatique)"
          git push

      # On ne republie que si le site a changé (push manuel ou nouvelle vidéo)
      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || steps.video.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.video.outputs.changed == 'true'
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
        if: github.event_name != 'schedule' || steps.video.outputs.changed == 'true'
